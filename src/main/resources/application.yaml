spring:
  application:
    name: ${SPRING_APPLICATION_NAME:enterprise-intranet-api}

  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/intranet_corporativa?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:local_user}
    password: ${DATABASE_PASSWORD:local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8081
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.backendintranet: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG